version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: eduflow-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: eduflow
    ports:
      - "5432:5432"
    volumes:
      - eduflow_pgdata:/var/lib/postgresql/data

  adminer:
    image: adminer:latest
    container_name: eduflow-adminer
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  eduflow_pgdata:
