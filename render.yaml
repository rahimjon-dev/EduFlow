services:
  - type: web
    name: eduflow
    env: node
    plan: free
    region: frankfurt
    buildCommand: npm run build
    startCommand: npm run start
    healthCheckPath: /api
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: eduflow-postgres
          property: connectionString
      - key: RENDER_EXTERNAL_URL
        sync: false

databases:
  - name: eduflow-postgres
    plan: free
    region: frankfurt
    databaseName: eduflow
    user: eduflow_user
